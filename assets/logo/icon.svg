    <line x1="-127" y1="-127" x2="-198" y2="-198" stroke="#38bdf8" stroke-width="22" stroke-linecap="round"/>
    <line x1="127" y1="-127" x2="198" y2="-198" stroke="#38bdf8" stroke-width="22" stroke-linecap="round"/>
